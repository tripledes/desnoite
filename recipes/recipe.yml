---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: desnoite
# description will be included in the image's metadata
description: Desnoite is a custom image for my personal use.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 43 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: brew
    nofile-limits: true
    brew-analytics: true

  - type: bling
    install:
      - rpmfusion

  - type: dnf
    repos:
      files:
        - emby.repo
        - emby-beta.repo
    install:
      packages:
        - fzf
        - git
        - git-lfs
        - htop
        - media.emby.client.beta.x86_64
        - neovim
        - ripgrep
        - s-tui
        - tmux
        - zsh
    group-install:
      packages:
        - development-tools
        - rpm-development-tools
        - container-management
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: user
        repo:
          title: Fedora
          url: oci+https://registry.fedoraproject.org
          name: fedora
        install:
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.Browser
          - com.obsproject.Studio.Plugin.DroidCam
          - com.obsproject.Studio.Plugin.VLCVideo
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: user
        repo:
          title: Flathub
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - com.borgbase.Vorta
          - com.obsproject.Studio.Plugin.Gstreamer
          - com.obsproject.Studio.Plugin.GStreamerVaapi
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - com.spotify.Client
          - com.tomjwatson.Emote
          - com.valvesoftware.Steam
          - com.yubico.yubioath
          - im.riot.Riot
          - io.podman_desktop.PodmanDesktop
          - md.obsidian.Obsidian
          - net.lutris.Lutris
          - org.fedoraproject.MediaWriter
          - org.gimp.GIMP
          - org.kde.kdenlive
          - org.libreoffice.LibreOffice
          - org.mozilla.firefox
          - org.signal.Signal
          - org.videolan.VLC

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
