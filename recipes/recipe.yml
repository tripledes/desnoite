---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: desnoite
description: Desnoite is a custom image for my personal use.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - type: files
    files:
      - source: system/etc
        destination: /etc

  - type: brew
    nofile-limits: true
    brew-analytics: true
    auto-update: true
    update-interval: "7d"

  - type: bling
    install:
      - rpmfusion

  - type: dnf
    repos:
      files:
        - emby.repo
        - emby-beta.repo
        - google-cloud-sdk.repo
        - vscode.repo
      nonfree: rpmfusion
    install:
      packages:
        - alacritty
        - arc-kde
        - chezmoi
        - code
        - direnv
        - distrobox
        - fedora-packager
        - fedpkg
        - foomatic-db-ppds
        - fzf
        - git
        - git-lfs
        - goose
        - google-cloud-cli
        - htop
        - intel-media-driver
        - libvirt-daemon
        - libvirt-nss
        - libva-utils
        - libxcrypt-compat
        - lm_sensors
        - lsof
        - media.emby.client.beta
        - mediawriter
        - mesa-va-drivers-freeworld
        - mock
        - neovim
        - okular
        - ollama
        - openrgb
        - powertop
        - ripgrep
        - s-tui
        - steam-devices
        - strace
        - syncthing
        - tlp
        - tlp-pd
        - tmux
        - unrar
        - unzip
        - virt-manager
        - wget
        - zsh
    group-install:
      install-weak-deps: true
      with-optional: true
      exclude:
        - PackageKit-gstreamer-plugin
      packages:
        - development-tools
        - rpm-development-tools
        - container-management
        - multimedia
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - tuned
        - tuned-ppd
    replace:
      - from-repo: rpmfusion-free
        allow-erasing: true
        packages:
          - old: ffmpeg-free
            new: ffmpeg

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
        - UbuntuMono
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        repo:
          title: Fedora
          url: oci+https://registry.fedoraproject.org
          name: fedora
        install:
          - com.github.tchx84.Flatseal
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.Browser
          - com.obsproject.Studio.Plugin.DroidCam
          - com.obsproject.Studio.Plugin.VLCVideo
          - net.scribus.Scribus
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.kde.elisa
          - org.kde.kamoso
          - org.kde.kdenlive
          - org.keepassxc.KeePassXC
          - org.libreoffice.LibreOffice
          - org.mozilla.firefox
          - org.videolan.VLC
          - org.wireshark.Wireshark
      - notify: false
        scope: user
        repo:
          title: Flathub
        install:
          - com.borgbase.Vorta
          - com.google.Chrome
          - com.obsproject.Studio.Plugin.Gstreamer
          - com.obsproject.Studio.Plugin.GStreamerVaapi
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - com.spotify.Client
          - com.valvesoftware.Steam
          - com.yubico.yubioath
          - im.riot.Riot
          - io.github.flattool.Warehouse
          - io.podman_desktop.PodmanDesktop
          - md.obsidian.Obsidian
          - net.lutris.Lutris
          - org.signal.Signal
          - org.telegram.desktop
  - type: systemd
    system:
      enabled:
        - libvirtd.socket
        - tlp.service
        - tlp-pd.service
  - type: signing
