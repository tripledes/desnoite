---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: desnoite-amd-desktop
description: Desnoite is a custom image for AMD based desktops.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - from-file: common-base.yml
  - type: dnf
    repos:
      files:
        - emby.repo
        - emby-beta.repo
    install:
      packages:
        - media.emby.client.beta
        - mesa-va-drivers-freeworld
        - ollama
        - openrgb
        - steam-devices
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: user
        repo:
          title: Flathub
        install:
          - com.valvesoftware.Steam
          - net.lutris.Lutris
